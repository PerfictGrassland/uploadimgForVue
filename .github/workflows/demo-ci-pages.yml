# 基础定义与触发条件 (Trigger)
# 流水线的名字，在 GitHub Actions 标签页里显示。
name: Vue CI Build & Deploy - GitHubPages 
# 定义什么时候触发这个流水线
# 只要有代码 push 到 main 分支，就会触发。
# 如果有针对 main 分支的 pull_request（比如提了 PR），也会触发。但注意，后面部署步骤加了判断，PR 阶段不会真正去部署生产。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 流水线中的大任务模块。这是第一个任务 build-job
jobs:
  # 构建任务 (Build Job)
  build-job:
    # 指定 GitHub 分配一台最新的 Ubuntu 虚拟机来执行。
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        # 必须第一步！把仓库里的代码拉取到虚拟机上。
        uses: actions/checkout@v4
      - name: 设置 Node.js
        # 安装 Node.js。指定了版本 22.23.4，并开启了 cache: 'npm'（根据 package-lock.json 缓存依赖，极大加快下一次构建速度）。
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: 'npm'
      - name: 安装依赖
        # 严格按照 package-lock.json 安装依赖（比 npm install 更严谨，适合 CI 环境）。
        run: npm ci
      - name: Vue打包
        # 执行 Vue 打包，生成 dist 文件夹。
        run: npm run build
      - name: 保存dist产物
        # 极其重要的一步。把打包好的 dist 文件夹打包成一个名为 dist-files 的“工件（Artifact）”，
        # 保存在云端。因为每个 Job 运行在独立的虚拟机上，不存下来，后面的部署 Job 就找不到文件。
        # 下面下载用actions/download-artifact@v4
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/

  # 测试任务 (Test Jobs)
  # 因为 test-job1 和 test-job2 之间没有相互依赖，所以它们会并行执行（同时跑）。这里用 echo 和 sleep 模拟了真实的单元测试耗时。
  test-job1:
    # 关键配置！说明这两个任务必须在 build-job（构建任务） 成功之后才能开始。
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - run: echo "单元测试1执行完成"

  test-job2:
    # 关键配置！说明这两个任务必须在 build-job（构建任务） 成功之后才能开始。
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - run: echo "单元测试2执行开始"
      - run: sleep 20
      - run: echo "单元测试2执行完成"

  # 部署任务 (Deploy Job)
  deploy-prod:
    # 部署任务必须等两个测试任务都成功跑完才能开始。
    needs: [test-job1, test-job2]
    # 安全判断。如果触发原因是 push（提交代码）并且分支是 main，才执行部署。如果是别人提的 PR，测试跑完就结束了，不会去碰生产环境。
    #  因为你上面配置了 pull_request 也会触发。如果没有这个 if，别人给你提了一个 PR，测试跑完后，你的代码就直接上线覆盖了生产环境，
    # 这绝对是灾难。加上这个，PR 阶段只跑测试，只有代码真正合并到 main，才去部署。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 下载打包产物dist
        # 从云端把 build-job 保存的 dist-files 下载下来，解压到当前目录，对应上面的actions/upload-artifact@v4
        # 因为 GitHub Actions 的每一个 job 都是在一台完全独立、全新的虚拟机上运行的。在 build-job 里打包出来的 dist 文件夹，随着那台虚拟机销毁已经没了。
        # actions/download-artifact@v4：这个官方插件会去云端把之前 upload-artifact 存上去的 dist-files 下载下来，并解压到当前目录的 dist/ 下。现在，这台全新的机器上有了打包好的网页文件。
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/
      - name: 部署到GitHub Pages
        # 这不是 GitHub 官方的插件，而是社区里极其出名的一个 Action（由开发者 peaceiris 编写）。
        # 它会在你的仓库里偷偷创建一个名为 gh-pages 的新分支，然后把你刚刚下载的 dist 目录里的所有文件，
        # 强制 push 到那个 gh-pages 分支上。而 GitHub 的 Pages 功能，恰恰就是读取这个 gh-pages 分支来展示网页的。
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 这是一个神奇的令牌。你不需要手动去配置，GitHub 每次跑 Actions 时都会自动注入这个临时 Token。它赋予了插件“向仓库推送代码”的权限，这样插件才能把文件推送到 gh-pages 分支。
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 告诉插件，要发布的网站根目录是 dist 文件夹。
          publish_dir: ./dist

  # 部署job：只在push到main才执行，PR阶段不执行部署
